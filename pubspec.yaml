name: agenda
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_svg: ^1.0.3
  
  path_provider: ^2.1.2
  flutter_picker: ^2.0.3 #picker para add timer
  table_calendar: ^3.0.6 #calendar

  mobx: ^2.1.3
  flutter_mobx: ^2.0.6+5 
  provider: ^6.1.2
  brasil_fields: ^1.12.0
  flutter_modular: ^6.3.4
  all_validations_br: ^3.0.0
  
  dartz: ^0.10.1
  sembast: ^3.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3

  flutter_lints: ^1.0.0

  build_runner: ^2.3.3
  mobx_codegen: ^2.1.1
  hive_generator: ^2.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - asset/icones/Icon/

  fonts:
    - family: Montserrat
      fonts:
      - asset: asset/fonts/Montserrat-Regular.ttf
      - asset: asset/fonts/Montserrat-Medium.ttf
        weight: 500
      - asset: asset/fonts/Montserrat-Bold.ttf
        weight: 700